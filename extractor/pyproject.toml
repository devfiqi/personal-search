[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-search-extractor"
version = "0.1.0"
description = "Local document extraction worker for Personal Search"
requires-python = ">=3.12"
dependencies = [
    "fastembed==0.8.1",
    "hnswlib==0.8.0",
    "pypdf==6.19.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller==6.22.3",
]

[tool.setuptools.packages.find]
where = ["src"]
